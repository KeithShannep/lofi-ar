<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f0f12" />
  <title>LoFi Layers AR</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0f0f12;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}#ar-container{position:fixed;inset:0}#ui{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;padding:env(safe-area-inset-top) 16px calc(18px + env(safe-area-inset-bottom));box-sizing:border-box;z-index:10}.top{display:flex;justify-content:space-between;align-items:center;padding-top:12px}.brand{background:rgba(0,0,0,.58);color:#fff;padding:10px 14px;border-radius:16px;font-weight:800;letter-spacing:.4px;backdrop-filter:blur(10px)}.status{align-self:center;margin-bottom:22px;background:rgba(0,0,0,.62);color:#fff;padding:12px 16px;border-radius:18px;font-size:14px;text-align:center;max-width:min(88vw,520px);backdrop-filter:blur(10px)}.status.found{background:rgba(17,80,45,.8)}.status.error{background:rgba(120,25,25,.84)}#start{pointer-events:auto;position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:#0f0f12;padding:24px;box-sizing:border-box}#start.hidden{display:none}.start-card{width:min(92vw,420px);text-align:center;color:#fff}.start-card h1{font-size:28px;margin:0 0 10px}.start-card p{color:#b7b7c0;line-height:1.45;margin:0 0 20px}.start-card button{border:0;border-radius:14px;background:#7c7cff;color:#fff;padding:14px 20px;width:100%;font-weight:800;font-size:16px}
  </style>
</head>
<body>
  <div id="ar-container"></div><div id="ui"><div class="top"><div class="brand">LOFI LAYERS AR</div></div><div id="status" class="status">Ready.</div></div><div id="start"><div class="start-card"><h1>LoFi Layers AR</h1><p>Tap below, allow camera access, then point your phone at a LoFi Layers AR print.</p><button id="startBtn">START AR</button></div></div>
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
  <script type="module">
    import * as THREE from 'three';
    import { MindARThree } from 'https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js';
    const statusEl=document.getElementById('status'),startEl=document.getElementById('start'),startBtn=document.getElementById('startBtn'),container=document.getElementById('ar-container');
    const setStatus=(t,k='')=>{statusEl.textContent=t;statusEl.className='status'+(k?' '+k:'')};
    async function boot(){startBtn.disabled=true;startBtn.textContent='STARTING…';try{const r=await fetch('./assets/config.json',{cache:'no-store'});if(!r.ok)throw new Error('Could not load config');const config=await r.json();const mindarThree=new MindARThree({container,imageTargetSrc:'./assets/targets.mind',maxTrack:1,filterMinCF:.0001,filterBeta:.001,uiLoading:'no',uiScanning:'no',uiError:'yes'});const{renderer,scene,camera}=mindarThree;renderer.outputColorSpace=THREE.SRGBColorSpace;const objs=[];for(const item of config.targets){const anchor=mindarThree.addAnchor(item.index);const video=document.createElement('video');video.src=item.video;video.loop=true;video.muted=true;video.playsInline=true;video.preload='auto';video.crossOrigin='anonymous';const texture=new THREE.VideoTexture(video);texture.colorSpace=THREE.SRGBColorSpace;texture.minFilter=THREE.LinearFilter;texture.magFilter=THREE.LinearFilter;const material=new THREE.MeshBasicMaterial({map:texture,transparent:true,side:THREE.DoubleSide,toneMapped:false});const plane=new THREE.Mesh(new THREE.PlaneGeometry(1,1),material);plane.position.z=.001;anchor.group.add(plane);video.addEventListener('loadedmetadata',()=>{if(video.videoWidth&&video.videoHeight){const aspect=video.videoHeight/video.videoWidth;plane.geometry.dispose();plane.geometry=new THREE.PlaneGeometry(1,aspect)}},{once:true});video.addEventListener('error',()=>setStatus('VIDEO ERROR: '+item.name,'error'));anchor.onTargetFound=async()=>{for(const o of objs)if(o.video!==video)o.video.pause();setStatus('FOUND: '+item.name,'found');try{await video.play()}catch(e){setStatus('FOUND: '+item.name+' — video blocked','error')}};anchor.onTargetLost=()=>{video.pause();setStatus('SEARCHING FOR AR PRINT…')};objs.push({video})}setStatus('STARTING CAMERA…');await mindarThree.start();startEl.classList.add('hidden');setStatus('SEARCHING FOR AR PRINT…');renderer.setAnimationLoop(()=>renderer.render(scene,camera))}catch(e){console.error(e);setStatus(e.message||'Could not start AR.','error');startBtn.disabled=false;startBtn.textContent='TRY AGAIN'}}
    startBtn.addEventListener('click',boot);
  </script>
</body></html>
