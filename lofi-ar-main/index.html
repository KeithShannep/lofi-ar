<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f0f12" />
  <title>LoFi Layers AR</title>
  <style>
    html,body { margin:0; width:100%; height:100%; overflow:hidden; background:#0f0f12; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
    #ar-container { position:fixed; inset:0; }
    #ui { position:fixed; inset:0; pointer-events:none; display:flex; flex-direction:column; justify-content:space-between; padding:env(safe-area-inset-top) 16px calc(18px + env(safe-area-inset-bottom)); box-sizing:border-box; z-index:10; }
    .top { display:flex; justify-content:space-between; align-items:center; padding-top:12px; }
    .brand { background:rgba(0,0,0,.58); color:#fff; padding:10px 14px; border-radius:16px; font-weight:800; letter-spacing:.4px; backdrop-filter:blur(10px); }
    .status { align-self:center; margin-bottom:22px; background:rgba(0,0,0,.62); color:#fff; padding:12px 16px; border-radius:18px; font-size:14px; text-align:center; max-width:min(88vw,420px); backdrop-filter:blur(10px); }
    .status.found { background:rgba(17,80,45,.78); }
    .status.error { background:rgba(120,25,25,.82); }
  </style>
</head>
<body>
  <div id="ar-container"></div>
  <div id="ui">
    <div class="top"><div class="brand">LOFI LAYERS AR</div></div>
    <div id="status" class="status">Loading…</div>
  </div>

  <script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
  <script type="module">
    import * as THREE from 'three';
    import { MindARThree } from 'https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js';

    const statusEl = document.getElementById('status');
    const container = document.getElementById('ar-container');

    function setStatus(text, cls) {
      statusEl.textContent = text;
      statusEl.className = 'status' + (cls ? ' ' + cls : '');
    }

    // Multi-target config: assets/config.json is generated by manager.html and
    // maps each compiled target index (in assets/targets.mind) to a name + video.
    async function loadConfig() {
      try {
        const res = await fetch('./assets/config.json', { cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const config = await res.json();
        if (!config.targets || !config.targets.length) throw new Error('no targets in config');
        return config;
      } catch (err) {
        console.error('[LoFi AR] Could not load assets/config.json', err);
        return null;
      }
    }

    async function main() {
      const config = await loadConfig();
      if (!config) {
        setStatus('No AR prints configured yet. Use manager.html to build a site.', 'error');
        return;
      }

      const mindarThree = new MindARThree({
        container,
        imageTargetSrc: './assets/targets.mind',
        maxTrack: config.targets.length,
        filterMinCF: 0.0001,
        filterBeta: 0.001,
        uiLoading: 'no',
        uiScanning: 'no',
        uiError: 'yes'
      });

      const { renderer, scene, camera } = mindarThree;
      renderer.outputColorSpace = THREE.SRGBColorSpace;

      // Tracks which target indexes are currently visible, so the status banner
      // stays correct even if more than one print is in frame at once.
      const found = new Map(); // index -> name

      function refreshStatus() {
        if (found.size === 0) {
          setStatus('SEARCHING FOR AR PRINT…');
        } else {
          const latest = [...found.values()].pop();
          setStatus('FOUND: ' + latest, 'found');
        }
      }

      config.targets
        .slice()
        .sort((a, b) => a.index - b.index)
        .forEach((target) => {
          // One anchor + one video plane per target, same setup as the
          // original single-target build, just repeated per config entry.
          const anchor = mindarThree.addAnchor(target.index);

          const video = document.createElement('video');
          video.src = target.video;
          video.loop = true;
          video.muted = true;
          video.playsInline = true;
          video.preload = 'auto';
          video.crossOrigin = 'anonymous';

          const texture = new THREE.VideoTexture(video);
          texture.colorSpace = THREE.SRGBColorSpace;
          texture.minFilter = THREE.LinearFilter;
          texture.magFilter = THREE.LinearFilter;

          const material = new THREE.MeshBasicMaterial({
            map: texture,
            transparent: true,
            side: THREE.DoubleSide,
            toneMapped: false
          });
          const plane = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), material);
          plane.position.z = 0.001;
          anchor.group.add(plane);

          video.addEventListener('error', () => {
            console.error('[LoFi AR] Video error for target', target.index, target.name, video.error);
          });

          video.addEventListener('loadedmetadata', () => {
            const aspect = video.videoHeight / video.videoWidth;
            plane.geometry.dispose();
            plane.geometry = new THREE.PlaneGeometry(1, aspect);
          });

          anchor.onTargetFound = async () => {
            console.log('[LoFi AR] TARGET FOUND', target.index, target.name);
            found.set(target.index, target.name);
            refreshStatus();
            try {
              await video.play();
            } catch (e) {
              console.warn('[LoFi AR] Video play blocked:', e);
            }
          };

          anchor.onTargetLost = () => {
            console.log('[LoFi AR] TARGET LOST', target.index, target.name);
            found.delete(target.index);
            refreshStatus();
            video.pause();
          };
        });

      try {
        setStatus('STARTING CAMERA…');
        await mindarThree.start();
        refreshStatus();
        console.log('[LoFi AR] Camera started. Tracking', config.targets.length, 'target(s).');
        renderer.setAnimationLoop(() => renderer.render(scene, camera));
      } catch (err) {
        console.error(err);
        setStatus('Could not start AR. Make sure this page is served over HTTPS and camera permission is allowed.', 'error');
      }
    }

    main();
  </script>
</body>
</html>
